environment:
  id: LunarLander-v3
  seed: 42

training:
  episodes: 1000
  max_steps_per_episode: 500
  replay_capacity: 100000
  min_replay_size: 1000
  batch_size: 64
  gamma: 0.99
  learning_rate: 0.0005
  target_update_interval: 250
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 50000
  gradient_clip: 10.0
  hidden_dims: [128, 128]
  device: auto
